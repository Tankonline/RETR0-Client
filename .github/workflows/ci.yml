name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-checks:
    name: Scripts compile, patch assembles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build scripts compile
        run: python -m py_compile patches/store_grant_patch/build_patch.py patches/ui_text/retr0_gui_patch.py patches/local_server_redirect/build_redirect_dex.py patches/retr0_link/build_link.py
      - name: Build scripts show their options
        run: |
          python patches/store_grant_patch/build_patch.py --help
          python patches/ui_text/retr0_gui_patch.py --help
          python patches/local_server_redirect/build_redirect_dex.py --help
          python patches/retr0_link/build_link.py --help
      - name: RETR0 link Java compiles (Java 8 target, android.util.Log stubbed)
        run: |
          mkdir -p /tmp/link
          javac --release 8 -d /tmp/link patches/retr0_link/ci_stub/android/util/Log.java patches/retr0_link/src/com/retr0/*.java
          ls /tmp/link/com/retr0
      - name: ARM64 handlers assemble
        run: clang --target=aarch64-linux-android -c patches/store_grant_patch/store_grant_patch.S -o /tmp/patch.o && echo "assembled OK"
      - name: Redirect C compiles freestanding, code and data only in .text/.rodata
        run: |
          clang --target=aarch64-linux-android -Os -fno-pic -fno-pie -fno-unroll-loops -fno-vectorize -fno-slp-vectorize \
            -ffreestanding -fno-builtin -mgeneral-regs-only -fno-stack-protector -fno-jump-tables \
            -fno-asynchronous-unwind-tables -fno-unwind-tables -c patches/store_grant_patch/retr0_redirect.c -o /tmp/redirect.o
          readelf -SW /tmp/redirect.o
          if readelf -SW /tmp/redirect.o | grep -E '\] \.(data|bss|got)'; then echo "writable data in the redirect"; exit 1; fi
          echo "compiled OK"

  safety:
    name: No game material, links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse APKs and other game or binary files
        run: |
          bad=$(git ls-files | grep -Ei '\.(apk|dex|so|bin|dat|zip|obb|keystore|jks)$' || true)
          if [ -n "$bad" ]; then echo "Game or binary files must not be committed:"; echo "$bad"; exit 1; fi
      - name: Check relative links in Markdown
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path
          bad = []
          for f in Path(".").rglob("*.md"):
              if ".git" in f.parts:
                  continue
              for m in re.finditer(r"\]\(([^)#\s]+)(#[^)]*)?\)", f.read_text(encoding="utf-8")):
                  t = m.group(1)
                  if t.startswith(("http://", "https://", "mailto:")):
                      continue
                  if not (f.parent / t).exists():
                      bad.append(f"{f}: {t}")
          print("\n".join(bad) or "all relative links resolve")
          sys.exit(1 if bad else 0)
          EOF
